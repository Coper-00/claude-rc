<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e2a44">
<title>월급 캐치</title>
<style>
  :root {
    --bg1: #1e2a44;
    --ink: #ffffff;
    --accent: #ffcc33;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg1);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    font-weight: 700; font-size: 18px;
    pointer-events: none;
    text-shadow: 0 2px 4px rgba(0,0,0,.4);
  }
  #lives { letter-spacing: 2px; }
  #letters {
    position: absolute; left: 16px; top: calc(56px + env(safe-area-inset-top));
    display: none; gap: 4px; pointer-events: none;
  }
  #letters.show { display: flex; }
  #letters span {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800;
    background: rgba(0,0,0,.35); color: rgba(255,255,255,.35);
    border: 2px solid rgba(255,255,255,.2);
  }
  #letters span.on { background: #ff7a00; color: #fff; border-color: #ffd27a; box-shadow: 0 0 10px #ff9a2a; }
  #muteBtn {
    position: absolute; right: 16px; top: calc(54px + env(safe-area-inset-top));
    width: 38px; height: 38px; margin: 0; padding: 0;
    border-radius: 50%; border: 2px solid rgba(255,255,255,.3);
    background: rgba(0,0,0,.35); box-shadow: none;
    font-size: 18px; line-height: 1; z-index: 5;
  }
  #muteBtn:active { transform: translateY(2px); box-shadow: none; }
  #skillBtn {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(52px + env(safe-area-inset-top));
    width: 150px; height: 40px; margin: 0; padding: 0;
    border-radius: 20px; border: 2px solid rgba(255,255,255,.35);
    background: rgba(0,0,0,.35); box-shadow: none;
    color: #fff; font-size: 15px; font-weight: 700;
    overflow: hidden; display: none;
  }
  #skillBtn.show { display: block; }
  #skillBtn:active { transform: translateX(-50%) translateY(2px); box-shadow: none; }
  #skillFill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: linear-gradient(90deg, #6a5cff, #b04cff);
    transition: width .2s;
  }
  #skillLabel { position: relative; }
  #skillBtn.ready { border-color: var(--accent); box-shadow: 0 0 12px var(--accent); }
  #skillBtn.ready::after {
    content: ""; position: absolute; inset: 0; border-radius: 20px;
    background: rgba(255,255,255,.35); opacity: 0;
    animation: glow .8s ease-in-out infinite alternate; will-change: opacity;
  }
  #skillBtn.ready #skillFill { background: linear-gradient(90deg, #ffb300, #ffdd55); }
  #skillBtn.ready #skillLabel { color: #1e2a44; }
  @keyframes glow { from { opacity: 0; } to { opacity: 1; } }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: calc(70px + env(safe-area-inset-top)) 20px 24px; text-align: center;
    background: rgba(15, 22, 40, .8);
    backdrop-filter: blur(3px);
    overflow-y: auto;
    touch-action: pan-y;
  }
  .overlay > :first-child { margin-top: auto; }
  .overlay > :last-child { margin-bottom: auto; }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 34px; color: var(--accent); }
  .overlay p { font-size: 16px; line-height: 1.6; opacity: .92; }
  .overlay .big { font-size: 22px; font-weight: 700; }
  .legend { display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.45; opacity: .92; }
  button {
    margin-top: 8px;
    font: inherit; font-size: 20px; font-weight: 700;
    padding: 14px 40px; border: 0; border-radius: 14px;
    background: var(--accent); color: #1e2a44;
    box-shadow: 0 6px 0 #c99a10;
    cursor: pointer;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #c99a10; }
  #newBest { color: var(--accent); font-weight: 700; }
  #level {
    position: absolute; right: 64px; top: calc(62px + env(safe-area-inset-top));
    font-weight: 800; font-size: 15px; pointer-events: none;
    padding: 3px 9px; border-radius: 12px; background: rgba(0,0,0,.35); display: none;
  }
  #level.show { display: block; }
  input#nameInput {
    font: inherit; font-size: 18px; text-align: center;
    width: 220px; padding: 12px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,.4); background: rgba(255,255,255,.95); color: #1e2a44;
    -webkit-user-select: text; user-select: text;
  }
  #nameError { color: #ff8a8a; font-size: 14px; min-height: 1em; }
  #hello { font-size: 17px; }
  #hello a { color: #9ec5ff; font-size: 14px; margin-left: 6px; text-decoration: underline; cursor: pointer; }
  .board {
    width: min(320px, 100%); background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15); border-radius: 14px; padding: 12px 14px;
  }
  .board h3 { font-size: 16px; margin-bottom: 8px; color: var(--accent); }
  .board ol { list-style: none; }
  .board li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 2px; font-size: 16px; }
  .board li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .board li .sc { font-weight: 700; font-variant-numeric: tabular-nums; }
  .board li.me { color: var(--accent); font-weight: 700; }
  .board li.sep { border-top: 1px dashed rgba(255,255,255,.25); margin-top: 4px; padding-top: 8px; }
  @media (max-height: 720px) {
    .overlay { gap: 8px; padding-top: calc(56px + env(safe-area-inset-top)); }
    .overlay h1 { font-size: 28px; }
    .overlay p { font-size: 14px; line-height: 1.45; }
    .legend { font-size: 13px; gap: 2px; }
    button { padding: 11px 36px; font-size: 18px; }
    .board li { padding: 3px 2px; font-size: 15px; }
  }
  .board .note { font-size: 13px; opacity: .7; margin-top: 6px; line-height: 1.4; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div>점수 <span id="score">0</span></div>
    <div id="lives">❤️❤️❤️</div>
    <div>최고 <span id="best">0</span></div>
  </div>
  <div id="letters"><span>보</span><span>너</span><span>스</span></div>
  <div id="level">Lv.1</div>
  <button id="muteBtn" aria-label="소리 켜기/끄기">🔊</button>
  <button id="skillBtn"><div id="skillFill"></div><span id="skillLabel">🌀 영끌 0/10</span></button>

  <div id="startScreen" class="overlay">
    <h1>월급 캐치</h1>
    <p>쏟아지는 월급을 돼지저금통으로 받으세요!<br>손가락으로 저금통을 움직입니다.</p>
    <div class="legend">
      <span>💵 월급 +10 · 🪙 금괴 +50 · ❤️ 하트 목숨 +1</span>
      <span>🧾 세금고지서는 피하기 · 월급 3번 놓치면 게임오버</span>
      <span>보·너·스 글자 모으면 10초 보너스 타임</span>
      <span>🌀 영끌: 10개 받으면 화면의 돈 싹 흡수</span>
      <span>⬆️ 1,000점마다 레벨 업, 점점 빨라짐</span>
    </div>
    <div id="nameBox">
      <input id="nameInput" maxlength="10" placeholder="이름(닉네임) 입력" autocomplete="nickname" enterkeyhint="go">
      <p id="nameError"></p>
    </div>
    <p id="hello" hidden><span id="helloName"></span> 님 · 내 최고 <span id="bestStart">0</span>점<a id="rename">이름 변경</a></p>
    <button id="startBtn">시작</button>
    <div class="board"><h3>🏆 랭킹 TOP 3</h3><ol id="boardStart"></ol><p class="note" id="noteStart"></p></div>
  </div>

  <div id="overScreen" class="overlay hidden">
    <h1>게임오버</h1>
    <p class="big">점수 <span id="finalScore">0</span></p>
    <p id="newBest"></p>
    <p>내 최고점수 <span id="bestOver">0</span></p>
    <div class="board"><h3>🏆 랭킹 TOP 3</h3><ol id="boardOver"></ol><p class="note" id="noteOver"></p></div>
    <button id="retryBtn">다시 하기</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  let ctx = canvas.getContext('2d');
  const mainCtx = ctx;
  const $ = id => document.getElementById(id);
  const BEST_KEY = 'salaryCatchBest';

  // ---------- 설정 ----------
  const MAX_LIVES = 3;
  const SKILL_NEED = 10;
  const BONUS_TIME = 10;
  const LEVEL_STEP = 1000;   // 이 점수마다 레벨 업

  // ===== 공유 랭킹 설정 =====
  // Firebase Realtime Database 주소를 따옴표 안에 붙여넣으세요.
  // 예: 'https://my-game-default-rtdb.asia-southeast1.firebasedatabase.app'
  // 비워 두면 이 기기 안에서만 랭킹이 저장됩니다.
  const FIREBASE_DB_URL = '';
  const WORD = ['보', '너', '스'];

  // ---------- 최고점수 저장 ----------
  let bestMem = 0;
  function loadBest() {
    try { return parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) { return bestMem; }
  }
  function saveBest(v) {
    bestMem = v;
    try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {}
  }

  // ---------- 사운드 (Web Audio로 직접 합성, 외부 파일 없음) ----------
  const Sound = (() => {
    const MUTE_KEY = 'salaryCatchMute';
    let ac = null, master, musicBus, sfxBus, noiseBuf;
    let muted = false;
    try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}
    let playing = false, bonusMode = false, step = 0, nextTime = 0, timer = null, lastCoin = 0;

    const freq = m => 440 * Math.pow(2, (m - 69) / 12);

    function init() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ac.destination);
      const comp = ac.createDynamicsCompressor(); comp.connect(master);
      musicBus = ac.createGain(); musicBus.gain.value = 0.32; musicBus.connect(comp);
      sfxBus = ac.createGain(); sfxBus.gain.value = 0.6; sfxBus.connect(comp);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }

    function tone(bus, type, f, t, dur, vol, f2) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t + dur + 0.02);
    }
    function noise(bus, t, dur, vol, hp, lp) {
      const src = ac.createBufferSource(); src.buffer = noiseBuf;
      const f = ac.createBiquadFilter(); f.type = lp ? 'lowpass' : 'highpass'; f.frequency.value = lp || hp;
      const g = ac.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(bus);
      src.start(t); src.stop(t + dur + 0.02);
    }

    // 밝은 장조 8비트풍 루프 (C-G-Am-F 진행, 8분음표 64스텝 = 8마디)
    const _ = null;
    const MELODY = [
      72,_,76,79, _,79,81,79,   79,_,74,_, 77,76,74,_,
      76,_,72,76, _,81,79,76,   77,_,76,74, _,72,74,_,
      72,_,76,79, _,84,83,81,   79,_,74,77, 79,_,74,_,
      76,_,72,76, 81,_,79,76,   77,76,74,72, 74,76,72,_
    ];
    const CHORD_ROOT = [48, 43, 45, 41]; // C G A F (베이스)
    const ARP = [[60,64,67],[59,62,67],[60,64,69],[60,65,69]];

    function scheduleStep(i, t) {
      const tr = bonusMode ? 2 : 0;          // 보너스 타임엔 한 음 올림
      const bar = Math.floor(i / 8) % 4, s8 = i % 8;
      const m = MELODY[i];
      const stepDur = 60 / (bonusMode ? 168 : 128) / 2;
      if (m !== null) tone(musicBus, 'square', freq(m + tr), t, stepDur * 1.6, 0.09);
      // 베이스: 8분음표로 근음-옥타브 펌핑
      const root = CHORD_ROOT[bar] + tr;
      tone(musicBus, 'triangle', freq(s8 % 2 ? root + 12 : root), t, stepDur * 0.9, 0.32);
      // 배경 아르페지오 (작게)
      const a = ARP[bar][s8 % 3] + tr + (bonusMode ? 12 : 0);
      tone(musicBus, 'sine', freq(a), t, stepDur * 0.8, bonusMode ? 0.06 : 0.04);
      // 드럼
      if (s8 === 0 || s8 === 4 || (bonusMode && s8 % 2 === 0)) tone(musicBus, 'sine', 150, t, 0.14, 0.5, 40);
      if (s8 === 2 || s8 === 6) noise(musicBus, t, 0.09, 0.12, 0, 1800);   // 스네어
      if (s8 % 2 === 1 || bonusMode) noise(musicBus, t, 0.035, 0.06, 7000); // 하이햇
    }

    function pump() {
      if (!ac || !playing) return;
      while (nextTime < ac.currentTime + 0.15) {
        scheduleStep(step, nextTime);
        nextTime += 60 / (bonusMode ? 168 : 128) / 2;
        step = (step + 1) % MELODY.length;
      }
    }

    return {
      unlock() { init(); },
      startMusic() {
        if (!ac) return;
        playing = true; bonusMode = false; step = 0; nextTime = ac.currentTime + 0.08;
        clearInterval(timer); timer = setInterval(pump, 25); pump();
      },
      stopMusic() { playing = false; clearInterval(timer); timer = null; },
      setBonus(on) { bonusMode = on; },
      suspend() { if (ac && ac.state === 'running') ac.suspend(); },
      resume() { if (ac && ac.state === 'suspended') ac.resume(); if (playing && ac) nextTime = Math.max(nextTime, ac.currentTime + 0.05); },
      isMuted() { return muted; },
      toggleMute() {
        muted = !muted;
        try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
        if (ac) master.gain.setTargetAtTime(muted ? 0 : 1, ac.currentTime, 0.02);
        return muted;
      },
      // 효과음
      coin(gold) {
        if (!ac) return;
        const t = ac.currentTime;
        if (t - lastCoin < 0.035) return;   // 보너스 타임에 소리가 뭉개지지 않게
        lastCoin = t;
        if (gold) {
          [88, 92, 95, 100].forEach((m, k) => tone(sfxBus, 'square', freq(m), t + k * 0.05, 0.18, 0.12));
        } else {
          tone(sfxBus, 'square', freq(83), t, 0.07, 0.12);         // 띠
          tone(sfxBus, 'square', freq(88), t + 0.07, 0.28, 0.12);  // 링~
        }
      },
      heart() {
        if (!ac) return;
        const t = ac.currentTime;
        [72, 76, 79, 84].forEach((m, k) => tone(sfxBus, 'triangle', freq(m), t + k * 0.06, 0.25, 0.3));
      },
      letter(i) {
        if (!ac) return;
        const t = ac.currentTime;
        tone(sfxBus, 'sine', freq(84 + i * 4), t, 0.4, 0.3);
        tone(sfxBus, 'sine', freq(91 + i * 4), t + 0.05, 0.4, 0.2);
      },
      hurt() {
        if (!ac) return;
        const t = ac.currentTime;
        tone(sfxBus, 'sawtooth', 220, t, 0.35, 0.18, 70);
        noise(sfxBus, t, 0.2, 0.15, 0, 800);
      },
      whoosh() {
        if (!ac) return;
        const t = ac.currentTime;
        const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 4;
        f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(3000, t + 0.6);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.15);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
        src.connect(f); f.connect(g); g.connect(sfxBus);
        src.start(t); src.stop(t + 0.85);
      },
      levelUp() {
        if (!ac) return;
        const t = ac.currentTime;
        [67, 71, 74, 79, 83].forEach((m, k) => tone(sfxBus, 'square', freq(m), t + k * 0.06, 0.16, 0.1));
      },
      fanfare() {
        if (!ac) return;
        const t = ac.currentTime;
        [72, 76, 79, 84, 79, 84].forEach((m, k) => tone(sfxBus, 'square', freq(m), t + k * 0.09, k === 5 ? 0.5 : 0.14, 0.12));
      },
      gameOver() {
        if (!ac) return;
        const t = ac.currentTime;
        [72, 67, 64, 60].forEach((m, k) => tone(sfxBus, 'triangle', freq(m), t + k * 0.18, 0.3, 0.3));
      }
    };
  })();

  // ---------- 플레이어 & 랭킹 ----------
  const Board = (() => {
    const ID_KEY = 'salaryCatchId', NAME_KEY = 'salaryCatchName', SENT_KEY = 'salaryCatchSent', LOCAL_KEY = 'salaryCatchLocalBoard';
    const url = FIREBASE_DB_URL.trim().replace(/\/+$/, '');
    const ls = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    };
    let id = ls.get(ID_KEY);
    if (!id) { id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); ls.set(ID_KEY, id); }
    let name = ls.get(NAME_KEY) || '';
    let cache = [];

    function clean(obj) {
      return Object.entries(obj || {})
        .map(([k, v]) => ({ id: k, name: String((v && v.name) || '').slice(0, 12), score: Number(v && v.score) }))
        .filter(r => r.name && Number.isFinite(r.score) && r.score > 0)
        .sort((a, b) => b.score - a.score);
    }
    async function req(method, path, body) {
      const ctl = new AbortController();
      const tm = setTimeout(() => ctl.abort(), 6000);
      try {
        const res = await fetch(`${url}/${path}.json`, {
          method, signal: ctl.signal,
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      } finally { clearTimeout(tm); }
    }
    function localGet() { try { return JSON.parse(ls.get(LOCAL_KEY) || '{}'); } catch (e) { return {}; } }

    return {
      shared: !!url,
      id: () => id,
      name: () => name,
      setName(n) { name = n; ls.set(NAME_KEY, n); },
      async load() {
        cache = url ? clean(await req('GET', 'scores')) : clean(localGet());
        return cache;
      },
      // 내 최고점수가 이전에 올린 기록보다 높거나 이름이 바뀌었으면 올림
      async submit(myBest) {
        if (!name || myBest <= 0) return;
        const sent = parseInt(ls.get(SENT_KEY), 10) || 0;
        const sentName = ls.get(SENT_KEY + 'Name');
        if (myBest <= sent && sentName === name) return;
        const rec = { name, score: myBest, ts: Date.now() };
        if (url) await req('PUT', 'scores/' + id, rec);
        else { const all = localGet(); all[id] = rec; ls.set(LOCAL_KEY, JSON.stringify(all)); }
        ls.set(SENT_KEY, String(myBest)); ls.set(SENT_KEY + 'Name', name);
      },
      list: () => cache
    };
  })();

  function renderBoard(olId, noteId, state) {
    const ol = $(olId), note = $(noteId);
    ol.textContent = '';
    const addRow = (rank, r, extraCls) => {
      const li = document.createElement('li');
      if (r.id === Board.id()) li.classList.add('me');
      if (extraCls) li.classList.add(extraCls);
      const nm = document.createElement('span'); nm.className = 'nm';
      nm.textContent = (['🥇', '🥈', '🥉'][rank - 1] || rank + '위') + ' ' + r.name;
      const sc = document.createElement('span'); sc.className = 'sc';
      sc.textContent = r.score.toLocaleString() + '점';
      li.append(nm, sc); ol.append(li);
    };
    if (state === 'loading') { note.textContent = '랭킹 불러오는 중…'; return; }
    if (state === 'error') { note.textContent = '랭킹을 불러오지 못했습니다. 인터넷 연결을 확인하세요.'; return; }
    const list = Board.list();
    list.slice(0, 3).forEach((r, i) => addRow(i + 1, r));
    const myIdx = list.findIndex(r => r.id === Board.id());
    if (myIdx >= 3) addRow(myIdx + 1, list[myIdx], 'sep');
    let msg = list.length ? `참가자 ${list.length}명` : '아직 기록이 없습니다. 첫 기록의 주인공이 되세요!';
    if (!Board.shared) msg += ' · 공유 랭킹 미설정(이 기기 기록만 표시)';
    note.textContent = msg;
  }

  async function refreshBoards() {
    renderBoard('boardStart', 'noteStart', 'loading');
    renderBoard('boardOver', 'noteOver', 'loading');
    try {
      await Board.load();
      renderBoard('boardStart', 'noteStart');
      renderBoard('boardOver', 'noteOver');
    } catch (e) {
      renderBoard('boardStart', 'noteStart', 'error');
      renderBoard('boardOver', 'noteOver', 'error');
    }
  }

  function syncNameUI() {
    const has = !!Board.name();
    $('nameBox').hidden = has;
    $('hello').hidden = !has;
    $('helloName').textContent = Board.name();
  }

  // ---------- 상태 ----------
  const pig = { x: 0, y: 0, w: 120, h: 75, targetX: null, face: 1, bob: 0 };
  let W = 0, H = 0, DPR = 1, S = 40;
  let bgGrad = null, bonusGrad = null;
  const spriteCache = new Map();
  let items = [], particles = [], popups = [];
  let score = 0, lives = MAX_LIVES, best = loadBest();
  let running = false, lastT = 0, elapsed = 0, shake = 0;
  let spawnTimer = 0, letterTimer = 0, heartTimer = 0;
  let charge = 0, vortex = 0, level = 1;
  let bonus = 0, bonusFade = 0, got = [false, false, false];
  const keys = { left: false, right: false };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.max(34, Math.min(48, W * 0.1));
    spriteCache.clear();
    bgGrad = null;
    pig.w = Math.max(90, Math.min(150, W * 0.26));
    pig.h = pig.w * 0.62;
    pig.y = H - pig.h - 32;
    pig.x = Math.max(pig.w / 2, Math.min(W - pig.w / 2, pig.x || W / 2));
  }

  // ---------- HUD ----------
  const hudCache = {};
  function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }
  function checkLevel() {
    const lv = Math.floor(score / LEVEL_STEP) + 1;
    if (lv > level) {
      level = lv;
      popups = popups.filter(p => !p.text.startsWith('레벨 업'));
      popup(W / 2, H * 0.32, `레벨 업! Lv.${level}`, '#7fe3ff', 32);
      Sound.levelUp();
    }
  }
  function updateHud() {
    if (running) checkLevel();
    setText('level', 'Lv.' + level);
    $('level').classList.toggle('show', running);
    setText('score', String(score));
    setText('best', String(best));
    setText('lives', '❤️'.repeat(lives) + '🖤'.repeat(MAX_LIVES - lives));
  }
  function updateSkill() {
    const ready = charge >= SKILL_NEED;
    $('skillFill').style.width = (charge / SKILL_NEED * 100) + '%';
    if (hudCache.charge === charge && hudCache.run === running) return;
    hudCache.charge = charge; hudCache.run = running;
    $('skillLabel').textContent = ready ? '🌀 영끌 사용!' : `🌀 영끌 ${charge}/${SKILL_NEED}`;
    $('skillBtn').classList.toggle('ready', ready);
    $('skillBtn').classList.toggle('show', running);
  }
  function updateLetters() {
    const spans = $('letters').children;
    for (let i = 0; i < 3; i++) spans[i].classList.toggle('on', bonus > 0 || got[i]);
    $('letters').classList.toggle('show', running);
  }

  // ---------- 아이템 ----------
  // type: money | gold | tax | heart | letter
  function makeItem(type, speedMul = 1, extra = {}) {
    const size = {
      money:  [S * 1.4, S * 0.75],
      gold:   [S * 1.2, S * 0.62],
      tax:    [S, S * 1.3],
      heart:  [S * 0.95, S * 0.95],
      letter: [S * 1.05, S * 1.05]
    }[type];
    const base = 150 * (1 + 0.18 * (Math.min(level, 10) - 1));
    items.push(Object.assign({
      type,
      w: size[0], h: size[1],
      x: size[0] / 2 + Math.random() * (W - size[0]),
      y: -size[1],
      vy: base * (0.8 + Math.random() * 0.4) * speedMul,
      rot: (Math.random() - 0.5) * 0.6,
      vr: type === 'letter' || type === 'heart' ? 0 : (Math.random() - 0.5) * 2,
      sway: Math.random() * Math.PI * 2,
      fromBonus: bonus > 0
    }, extra));
  }

  function spawnNormal() {
    const r = Math.random();
    if (elapsed > 8 && r < Math.min(0.3, 0.12 + 0.03 * (level - 1))) makeItem('tax');
    else if (r > 0.93) makeItem('gold', 1.25);
    else makeItem('money');
  }
  function spawnBonus() {
    makeItem(Math.random() < 0.2 ? 'gold' : 'money', 1.6);
  }
  function spawnLetter() {
    if (items.some(it => it.type === 'letter')) return;
    const need = [0, 1, 2].filter(i => !got[i]);
    if (!need.length) return;
    makeItem('letter', 0.75, { idx: need[Math.floor(Math.random() * need.length)] });
  }

  // ---------- 효과 ----------
  function burst(x, y, color, n = 12) {
    n = Math.min(n, 160 - particles.length);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 0.6, color });
    }
  }
  function popup(x, y, text, color, size = 22) {
    if (popups.length >= 14) popups.shift();
    popups.push({ x: Math.max(60, Math.min(W - 60, x)), y, text, color, size, life: 0.9 });
  }
  let lastVib = 0;
  function vibrate(ms) {
    const now = performance.now();
    if (now - lastVib < 120) return;
    lastVib = now;
    try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {}
  }

  // ---------- 규칙 ----------
  function loseLife(x, y, text) {
    lives--;
    shake = 0.3;
    vibrate(120);
    popup(x, y, text, '#ff5a5a');
    Sound.hurt();
    updateHud();
    if (lives <= 0) gameOver();
  }

  function collect(it, bySkill) {
    const cx = bySkill ? pig.x : it.x, cy = pig.y;
    if (it.type === 'money' || it.type === 'gold') {
      Sound.coin(it.type === 'gold');
      const pts = it.type === 'gold' ? 50 : 10;
      const color = it.type === 'gold' ? '#ffcc33' : bySkill ? '#c9a6ff' : '#9dffb0';
      score += pts;
      if (!bySkill && charge < SKILL_NEED) { charge++; updateSkill(); }
      if (!bySkill) vibrate(10);
      burst(cx, cy, color, it.type === 'gold' ? 18 : bySkill ? 5 : 8);
      popup(bySkill ? pig.x + (Math.random() - 0.5) * pig.w : it.x, cy - 10, '+' + pts, color);
    } else if (it.type === 'heart') {
      Sound.heart();
      if (lives < MAX_LIVES) { lives++; popup(cx, cy - 20, '❤️ +1', '#ff7a9a', 26); }
      else { score += 30; popup(cx, cy - 20, '+30', '#ff7a9a'); }
      burst(cx, cy, '#ff7a9a', 16);
      vibrate(30);
    } else if (it.type === 'letter') {
      Sound.letter(it.idx);
      got[it.idx] = true;
      popup(cx, cy - 20, WORD[it.idx] + '!', '#ffb347', 30);
      burst(cx, cy, '#ffb347', 16);
      vibrate(30);
      if (got.every(Boolean)) startBonus();
      updateLetters();
    }
    updateHud();
  }

  function startBonus() {
    Sound.fanfare();
    Sound.setBonus(true);
    bonus = BONUS_TIME;
    got = [false, false, false];
    spawnTimer = 0.3;
    vibrate([40, 40, 40, 40, 80]);
    popup(W / 2, H * 0.4, '보너스 타임!', '#ffdd55', 38);
    updateLetters();
  }

  function useSkill() {
    if (!running || charge < SKILL_NEED) return;
    let n = 0;
    items.forEach(it => { if (it.type !== 'tax' && !it.sucked) { it.sucked = true; it.suckV = 0; n++; } });
    charge = 0;
    vortex = 0.8;
    Sound.whoosh();
    vibrate([30, 40, 30]);
    popup(pig.x, pig.y - 50, n ? `영끌! x${n}` : '영끌!', '#c9a6ff', 26);
    updateSkill();
  }

  // ---------- 게임 흐름 ----------
  function start() {
    items = []; particles = []; popups = [];
    score = 0; lives = MAX_LIVES; elapsed = 0; shake = 0;
    spawnTimer = 0.4; letterTimer = 6; heartTimer = 22;
    charge = 0; vortex = 0; bonus = 0; got = [false, false, false]; level = 1;
    pig.x = W / 2; pig.targetX = null;
    $('startScreen').classList.add('hidden');
    $('overScreen').classList.add('hidden');
    running = true;
    Sound.unlock();
    Sound.startMusic();
    updateHud(); updateSkill(); updateLetters();
    lastT = performance.now();
  }

  function gameOver() {
    Sound.stopMusic();
    Sound.gameOver();
    running = false;
    bonus = 0;
    const isNew = score > best;
    if (isNew) { best = score; saveBest(best); }
    $('finalScore').textContent = score;
    $('bestOver').textContent = best;
    $('newBest').textContent = isNew && score > 0 ? '🎉 최고점수 갱신!' : '';
    updateHud(); updateSkill(); updateLetters();
    $('bestStart').textContent = best;
    setTimeout(() => $('overScreen').classList.remove('hidden'), 400);
    renderBoard('boardOver', 'noteOver', 'loading');
    Board.submit(best).catch(() => {}).finally(refreshBoards);
  }

  // 시작 버튼: 이름이 없으면 먼저 등록 (최초 1회)
  function onStartClick() {
    if (!Board.name()) {
      const n = $('nameInput').value.replace(/\s+/g, ' ').trim();
      if (n.length < 1) { $('nameError').textContent = '이름을 입력해 주세요.'; $('nameInput').focus(); return; }
      Board.setName(n.slice(0, 10));
      $('nameError').textContent = '';
      syncNameUI();
      $('nameInput').blur();
      if (best > 0) Board.submit(best).catch(() => {}).finally(refreshBoards);
    }
    start();
  }

  // 저금통 몸통과 아이템이 조금이라도 겹치면 획득
  function touching(it) {
    const hw = it.w / 2, hh = it.h / 2;
    return it.x + hw > pig.x - pig.w / 2 && it.x - hw < pig.x + pig.w / 2 &&
           it.y + hh > pig.y && it.y - hh < pig.y + pig.h;
  }

  // ---------- 업데이트 ----------
  function update(dt) {
    // 저금통 이동
    const prevX = pig.x;
    const kSpeed = W * 1.4;
    if (keys.left) { pig.targetX = null; pig.x -= kSpeed * dt; }
    if (keys.right) { pig.targetX = null; pig.x += kSpeed * dt; }
    if (pig.targetX !== null) pig.x += (pig.targetX - pig.x) * Math.min(1, dt * 18);
    pig.x = Math.max(pig.w / 2, Math.min(W - pig.w / 2, pig.x));
    if (Math.abs(pig.x - prevX) > 0.5) { pig.face = pig.x > prevX ? 1 : -1; pig.bob += dt * 18; }

    // 보너스 타임
    if (bonus > 0) {
      bonus -= dt;
      if (bonus <= 0) {
        bonus = 0;
        spawnTimer = 1.2; letterTimer = 10;
        popup(W / 2, H * 0.4, '보너스 종료', '#ffffff', 30);
        Sound.setBonus(false);
        updateLetters();
      }
    } else {
      elapsed += dt;
    }
    bonusFade += ((bonus > 0 ? 1 : 0) - bonusFade) * Math.min(1, dt * 4);

    // 생성
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      if (bonus > 0) { spawnBonus(); spawnTimer = 0.08 + Math.random() * 0.08; }
      else { spawnNormal(); spawnTimer = Math.max(0.28, 1.0 * Math.pow(0.85, level - 1)) * (0.7 + Math.random() * 0.6); }
    }
    if (bonus <= 0) {
      letterTimer -= dt;
      if (letterTimer <= 0) { spawnLetter(); letterTimer = 7 + Math.random() * 5; }
      heartTimer -= dt;
      if (heartTimer <= 0) { makeItem('heart', 0.8); heartTimer = (lives < MAX_LIVES ? 16 : 26) + Math.random() * 10; }
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (it.sucked) {
        const tx = pig.x, ty = pig.y + pig.h * 0.3;
        const dx = tx - it.x, dy = ty - it.y, d = Math.hypot(dx, dy);
        it.suckV += 2400 * dt;
        const step = Math.min(d, it.suckV * dt);
        it.x += dx / (d || 1) * step; it.y += dy / (d || 1) * step;
        it.rot += 12 * dt;
        it.scale = Math.max(0.3, Math.min(1, d / 200));
        if (d < 12) { items.splice(i, 1); collect(it, true); }
        continue;
      }
      it.y += it.vy * dt;
      it.sway += dt * 2;
      it.x += Math.sin(it.sway) * 20 * dt;
      it.rot += it.vr * dt;

      if (touching(it)) {
        items.splice(i, 1);
        if (it.type === 'tax') {
          burst(it.x, it.y, '#ff5a5a');
          loseLife(it.x, pig.y - 10, '세금! -1');
          if (!running) return;
        } else {
          collect(it, false);
        }
        continue;
      }
      if (it.y - it.h / 2 > H) {
        items.splice(i, 1);
        // 일반 시간에 나온 돈만 놓치면 감점. 보너스 타임 돈·하트·글자·세금은 무관
        if ((it.type === 'money' || it.type === 'gold') && !it.fromBonus) {
          loseLife(Math.max(40, Math.min(W - 40, it.x)), H - 40, '놓침!');
          if (!running) return;
        }
      }
    }

    stepFx(dt);
    if (shake > 0) shake -= dt;
    if (vortex > 0) vortex -= dt;
  }

  function stepFx(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y -= 50 * dt; p.life -= dt;
      if (p.life <= 0) popups.splice(i, 1);
    }
  }

  // ---------- 그리기 ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackground() {
    if (!bgGrad) {
      bgGrad = ctx.createLinearGradient(0, 0, 0, H);
      bgGrad.addColorStop(0, '#1e2a44');
      bgGrad.addColorStop(1, '#3b5b8c');
      bonusGrad = ctx.createLinearGradient(0, 0, 0, H);
      bonusGrad.addColorStop(0, '#ff7a00');
      bonusGrad.addColorStop(0.5, '#ffb347');
      bonusGrad.addColorStop(1, '#ffe08a');
    }
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    if (bonusFade > 0.01) {
      ctx.globalAlpha = bonusFade;
      ctx.fillStyle = bonusGrad;
      ctx.fillRect(0, 0, W, H);
      // 방사형 빛줄기
      const t = performance.now() / 1000;
      ctx.save();
      ctx.translate(W / 2, H * 0.35);
      ctx.rotate(t * 0.3);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      for (let k = 0; k < 12; k++) {
        ctx.rotate(Math.PI / 6);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-60, -Math.max(W, H)); ctx.lineTo(60, -Math.max(W, H)); ctx.fill();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    const t = performance.now() / 1000;
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 230 + t * (10 + i * 4)) % (W + 200)) - 100;
      const cy = 120 + i * (H / 6);
      ctx.beginPath();
      ctx.arc(cx, cy, 40, 0, Math.PI * 2);
      ctx.arc(cx + 40, cy + 6, 32, 0, Math.PI * 2);
      ctx.arc(cx - 38, cy + 8, 28, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, pig.y + pig.h, W, H);
  }

  function heartPath(s) {
    ctx.beginPath();
    ctx.moveTo(0, s * 0.35);
    ctx.bezierCurveTo(-s * 0.55, -s * 0.05, -s * 0.35, -s * 0.5, 0, -s * 0.2);
    ctx.bezierCurveTo(s * 0.35, -s * 0.5, s * 0.55, -s * 0.05, 0, s * 0.35);
    ctx.closePath();
  }

  function paintItem(it) {
    ctx.save();
    const w = it.w, h = it.h;
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 6; ctx.shadowOffsetY = 3;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    if (it.type === 'money') {
      ctx.fillStyle = '#6fcf7f';
      roundRect(-w / 2, -h / 2, w, h, 4); ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = '#2f8a45'; ctx.lineWidth = 2;
      roundRect(-w / 2 + 3, -h / 2 + 3, w - 6, h - 6, 3); ctx.stroke();
      ctx.fillStyle = '#e9ffe9';
      ctx.beginPath(); ctx.ellipse(0, 0, h * 0.32, h * 0.32, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2f8a45';
      ctx.font = `bold ${Math.round(h * 0.45)}px sans-serif`;
      ctx.fillText('₩', 0, 1);
    } else if (it.type === 'gold') {
      const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
      g.addColorStop(0, '#fff1a8'); g.addColorStop(1, '#e0a800');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-w * 0.32, -h / 2); ctx.lineTo(w * 0.32, -h / 2);
      ctx.lineTo(w / 2, h / 2); ctx.lineTo(-w / 2, h / 2);
      ctx.closePath(); ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = '#b07d00'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#9a6a00';
      ctx.font = `bold ${Math.round(h * 0.42)}px sans-serif`;
      ctx.fillText('GOLD', 0, 2);
    } else if (it.type === 'tax') {
      ctx.fillStyle = '#ffffff';
      roundRect(-w / 2, -h / 2, w, h, 3); ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.fillStyle = '#aab';
      for (let k = 0; k < 4; k++) ctx.fillRect(-w * 0.35, -h * 0.32 + k * h * 0.12, w * (k % 2 ? 0.5 : 0.7), h * 0.05);
      ctx.save();
      ctx.rotate(-0.25);
      ctx.strokeStyle = '#e02a2a'; ctx.lineWidth = 2.5;
      roundRect(-w * 0.42, h * 0.05, w * 0.84, h * 0.3, 4); ctx.stroke();
      ctx.fillStyle = '#e02a2a';
      ctx.font = `bold ${Math.round(w * 0.28)}px sans-serif`;
      ctx.fillText('세금', 0, h * 0.2);
      ctx.restore();
    } else if (it.type === 'heart') {
      ctx.shadowColor = '#ff5a7a'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 0;
      ctx.fillStyle = '#ff4d6d';
      heartPath(w * 1.2); ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.ellipse(-w * 0.2, -w * 0.12, w * 0.1, w * 0.06, -0.6, 0, Math.PI * 2); ctx.fill();
    } else if (it.type === 'letter') {
      const r = w / 2;
      ctx.shadowColor = '#ffb347'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 0;
      ctx.fillStyle = '#ff7a00';
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = '#ffd27a'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = `800 ${Math.round(r * 1.1)}px sans-serif`;
      ctx.fillText(WORD[it.idx], 0, 1);
    }
    ctx.restore();
  }

  // 아이템 그림을 종류별로 한 번만 그려 두고 재사용 (그림자 계산을 매 프레임 하지 않음)
  function getSprite(it) {
    const key = it.type + (it.idx ?? '') + '_' + S;
    let spr = spriteCache.get(key);
    if (spr) return spr;
    const pad = 20;
    const cw = Math.ceil(it.w * 1.3 + pad * 2), ch = Math.ceil(Math.max(it.h, it.w * 1.3) + pad * 2);
    spr = document.createElement('canvas');
    spr.width = cw * DPR; spr.height = ch * DPR;
    const c = spr.getContext('2d');
    c.setTransform(DPR, 0, 0, DPR, cw / 2 * DPR, ch / 2 * DPR);
    ctx = c;
    paintItem(it);
    ctx = mainCtx;
    spr.cw = cw; spr.ch = ch;
    spriteCache.set(key, spr);
    return spr;
  }

  function drawItem(it) {
    const spr = getSprite(it);
    let sc = it.scale || 1;
    if (it.type === 'heart') sc *= 1 + Math.sin(performance.now() / 120) * 0.08;
    ctx.save();
    ctx.translate(it.x, it.y);
    if (it.rot) ctx.rotate(it.rot);
    if (sc !== 1) ctx.scale(sc, sc);
    ctx.drawImage(spr, -spr.cw / 2, -spr.ch / 2, spr.cw, spr.ch);
    ctx.restore();
  }

  function drawPig() {
    const { w, h, face } = pig;
    const x = pig.x, y = pig.y + Math.abs(Math.sin(pig.bob)) * -3;
    const cy = y + h * 0.52, rx = w * 0.46, ry = h * 0.42;
    ctx.save();
    ctx.translate(x, 0);
    ctx.scale(face, 1);
    // 다리
    ctx.fillStyle = '#e88aa5';
    [-0.28, -0.1, 0.12, 0.3].forEach(k => { roundRect(w * k - w * 0.05, cy + ry * 0.6, w * 0.1, h * 0.22, 4); ctx.fill(); });
    // 꼬리
    ctx.strokeStyle = '#e88aa5'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(-rx - 4, cy - 4, 6, 0.5, Math.PI * 1.8); ctx.stroke();
    // 몸통
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(0, pig.y + h * 0.98, rx * 0.9, h * 0.07, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(-rx * 0.3, cy - ry * 0.4, 4, 0, cy, rx * 1.1);
    g.addColorStop(0, '#ffd1df'); g.addColorStop(1, '#f59ab5');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowColor = 'transparent';
    // 귀
    ctx.fillStyle = '#f07c9e';
    ctx.beginPath(); ctx.moveTo(rx * 0.25, cy - ry * 0.85); ctx.lineTo(rx * 0.45, cy - ry * 1.35); ctx.lineTo(rx * 0.6, cy - ry * 0.7); ctx.fill();
    // 동전 투입구
    ctx.fillStyle = '#7a2e48';
    roundRect(-rx * 0.35, cy - ry * 0.92, rx * 0.5, 5, 2.5); ctx.fill();
    // 코
    ctx.fillStyle = '#f07c9e';
    ctx.beginPath(); ctx.ellipse(rx * 0.95, cy + ry * 0.05, w * 0.07, h * 0.15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#9b3a5a';
    ctx.beginPath(); ctx.arc(rx * 0.95, cy - ry * 0.05, 2, 0, Math.PI * 2); ctx.arc(rx * 0.95, cy + ry * 0.18, 2, 0, Math.PI * 2); ctx.fill();
    // 눈
    ctx.fillStyle = '#2b1a22';
    ctx.beginPath(); ctx.arc(rx * 0.62, cy - ry * 0.3, 3, 0, Math.PI * 2); ctx.fill();
    // 볼
    ctx.fillStyle = 'rgba(255,110,150,0.45)';
    ctx.beginPath(); ctx.ellipse(rx * 0.55, cy + ry * 0.15, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
    // ₩ 마크
    ctx.fillStyle = 'rgba(122,46,72,0.35)';
    ctx.font = `bold ${Math.round(h * 0.32)}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('₩', -rx * 0.15, cy + ry * 0.1);
    ctx.restore();
  }

  function drawVortex() {
    const a = Math.min(1, vortex / 0.3);
    const t = performance.now() / 1000;
    ctx.save();
    ctx.translate(pig.x, pig.y);
    ctx.lineWidth = 3;
    for (let k = 0; k < 4; k++) {
      const r = ((t * 260 + k * 70) % 280);
      ctx.strokeStyle = `rgba(190,150,255,${a * (1 - r / 280) * 0.8})`;
      ctx.beginPath();
      ctx.ellipse(0, -r * 0.35, 300 - r, (300 - r) * 0.35, 0, Math.PI, Math.PI * 2);
      ctx.stroke();
    }
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 160);
    g.addColorStop(0, `rgba(176,76,255,${0.45 * a})`);
    g.addColorStop(1, 'rgba(176,76,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 160, Math.PI, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawBonusBar() {
    if (bonus <= 0) return;
    const bw = Math.min(260, W - 40), bx = (W - bw) / 2, by = 104;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 26px sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = '#a14a00';
    const label = `보너스 타임 ${Math.ceil(bonus)}`;
    ctx.strokeText(label, W / 2, by + 6);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, W / 2, by + 6);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    roundRect(bx, by + 26, bw, 10, 5); ctx.fill();
    ctx.fillStyle = '#fff';
    roundRect(bx, by + 26, bw * (bonus / BONUS_TIME), 10, 5); ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
    drawBackground();
    if (vortex > 0) drawVortex();
    items.forEach(drawItem);
    drawPig();
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    popups.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / 0.9);
      ctx.font = `bold ${p.size}px sans-serif`;
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    });
    ctx.globalAlpha = 1;
    drawBonusBar();
    ctx.restore();
  }

  function loop(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000);
    lastT = t;
    if (running) update(dt); else stepFx(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- 입력 ----------
  function setTarget(e) { pig.targetX = e.clientX; }
  canvas.addEventListener('pointerdown', e => { setTarget(e); try { canvas.setPointerCapture(e.pointerId); } catch (_) {} });
  canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) setTarget(e); });
  document.addEventListener('touchmove', e => { if (!e.target.closest('.overlay')) e.preventDefault(); }, { passive: false });
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') { if (e.key === 'Enter') onStartClick(); return; }
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if ((e.key === ' ' || e.key === 'Enter') && !running) onStartClick();
    else if ((e.key === ' ' || e.key === 's' || e.key === 'ArrowUp') && running) { e.preventDefault(); useSkill(); }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });
  $('startBtn').addEventListener('click', onStartClick);
  $('rename').addEventListener('click', () => {
    $('nameInput').value = Board.name();
    Board.setName('');
    syncNameUI();
    $('nameInput').focus();
  });
  $('retryBtn').addEventListener('click', start);
  $('skillBtn').addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); useSkill(); });
  document.addEventListener('visibilitychange', () => {
    lastT = performance.now();
    if (document.hidden) Sound.suspend(); else Sound.resume();
  });
  function syncMuteIcon() { $('muteBtn').textContent = Sound.isMuted() ? '🔇' : '🔊'; }
  $('muteBtn').addEventListener('pointerdown', e => {
    e.stopPropagation(); e.preventDefault();
    Sound.unlock(); Sound.toggleMute(); syncMuteIcon();
  });
  syncMuteIcon();

  window.addEventListener('resize', resize);
  resize();
  $('bestStart').textContent = best;
  syncNameUI();
  refreshBoards();
  updateHud();
  lastT = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
