<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e2a44">
<title>이력서 캐치</title>
<style>
  :root {
    --bg1: #1e2a44;
    --bg2: #3b5b8c;
    --ink: #ffffff;
    --accent: #ffcc33;
    --danger: #ff5a5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg1);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    font-weight: 700; font-size: 18px;
    pointer-events: none;
    text-shadow: 0 2px 4px rgba(0,0,0,.4);
  }
  #lives { letter-spacing: 2px; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center;
    background: rgba(15, 22, 40, .78);
    backdrop-filter: blur(3px);
  }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 34px; color: var(--accent); }
  .overlay p { font-size: 16px; line-height: 1.6; opacity: .92; }
  .overlay .big { font-size: 22px; font-weight: 700; }
  .legend { display: grid; grid-template-columns: auto auto; gap: 6px 12px; font-size: 15px; text-align: left; }
  button {
    margin-top: 8px;
    font: inherit; font-size: 20px; font-weight: 700;
    padding: 14px 40px; border: 0; border-radius: 14px;
    background: var(--accent); color: #1e2a44;
    box-shadow: 0 6px 0 #c99a10;
    cursor: pointer;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #c99a10; }
  #newBest { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div>점수 <span id="score">0</span></div>
    <div id="lives">❤️❤️❤️</div>
    <div>최고 <span id="best">0</span></div>
  </div>

  <div id="startScreen" class="overlay">
    <h1>이력서 캐치</h1>
    <p>하늘에서 떨어지는 이력서를 바구니로 받으세요.<br>손가락(또는 마우스·방향키)으로 바구니를 움직입니다.</p>
    <div class="legend">
      <span>📄 이력서</span><span>+10점</span>
      <span>⭐ 핵심인재 이력서</span><span>+50점</span>
      <span>🚫 스팸메일</span><span>받으면 목숨 -1</span>
    </div>
    <p>이력서를 3번 놓치면 게임오버</p>
    <p class="big">최고점수 <span id="bestStart">0</span></p>
    <button id="startBtn">시작</button>
  </div>

  <div id="overScreen" class="overlay hidden">
    <h1>게임오버</h1>
    <p class="big">점수 <span id="finalScore">0</span></p>
    <p id="newBest"></p>
    <p>최고점수 <span id="bestOver">0</span></p>
    <button id="retryBtn">다시 하기</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const BEST_KEY = 'resumeCatchBest';

  // ---------- 최고점수 저장 (localStorage, 실패 시 메모리) ----------
  let bestMem = 0;
  function loadBest() {
    try { return parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) { return bestMem; }
  }
  function saveBest(v) {
    bestMem = v;
    try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {}
  }

  // ---------- 화면 크기 ----------
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    basket.w = Math.max(80, Math.min(140, W * 0.24));
    basket.h = basket.w * 0.5;
    basket.y = H - basket.h - 32;
    basket.x = Math.max(basket.w / 2, Math.min(W - basket.w / 2, basket.x || W / 2));
  }

  // ---------- 상태 ----------
  const basket = { x: 0, y: 0, w: 120, h: 60, targetX: null };
  let items = [], particles = [], popups = [];
  let score = 0, lives = 3, best = loadBest();
  let running = false, lastT = 0, spawnTimer = 0, elapsed = 0, shake = 0;
  const keys = { left: false, right: false };

  function updateHud() {
    $('score').textContent = score;
    $('best').textContent = best;
    $('lives').textContent = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
  }

  // ---------- 아이템 ----------
  function spawn() {
    const r = Math.random();
    let type = 'resume';
    if (elapsed > 8 && r < 0.18) type = 'spam';
    else if (r > 0.93) type = 'gold';
    const w = Math.max(34, Math.min(48, W * 0.1));
    const speedBase = 140 + Math.min(elapsed * 6, 320);
    items.push({
      type,
      x: w / 2 + Math.random() * (W - w),
      y: -w,
      w, h: w * 1.3,
      vy: speedBase * (0.8 + Math.random() * 0.4) * (type === 'gold' ? 1.25 : 1),
      rot: (Math.random() - 0.5) * 0.6,
      vr: (Math.random() - 0.5) * 2,
      sway: Math.random() * Math.PI * 2
    });
  }

  function burst(x, y, color, n = 12) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 0.6, color });
    }
  }
  function popup(x, y, text, color) { popups.push({ x, y, text, color, life: 0.9 }); }

  function vibrate(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

  function loseLife(x, y, text) {
    lives--;
    shake = 0.3;
    vibrate(120);
    popup(x, y, text, '#ff5a5a');
    updateHud();
    if (lives <= 0) gameOver();
  }

  // ---------- 게임 흐름 ----------
  function start() {
    items = []; particles = []; popups = [];
    score = 0; lives = 3; elapsed = 0; spawnTimer = 0.4; shake = 0;
    basket.x = W / 2; basket.targetX = null;
    updateHud();
    $('startScreen').classList.add('hidden');
    $('overScreen').classList.add('hidden');
    running = true;
    lastT = performance.now();
  }

  function gameOver() {
    running = false;
    const isNew = score > best;
    if (isNew) { best = score; saveBest(best); }
    $('finalScore').textContent = score;
    $('bestOver').textContent = best;
    $('newBest').textContent = isNew && score > 0 ? '🎉 최고점수 갱신!' : '';
    updateHud();
    setTimeout(() => $('overScreen').classList.remove('hidden'), 400);
  }

  // ---------- 업데이트 ----------
  function update(dt) {
    elapsed += dt;

    // 바구니 이동
    const kSpeed = W * 1.4;
    if (keys.left) { basket.targetX = null; basket.x -= kSpeed * dt; }
    if (keys.right) { basket.targetX = null; basket.x += kSpeed * dt; }
    if (basket.targetX !== null) basket.x += (basket.targetX - basket.x) * Math.min(1, dt * 18);
    basket.x = Math.max(basket.w / 2, Math.min(W - basket.w / 2, basket.x));

    // 생성 간격: 시간이 지날수록 빨라짐
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawn();
      spawnTimer = Math.max(0.35, 1.1 - elapsed * 0.012) * (0.7 + Math.random() * 0.6);
    }

    const left = basket.x - basket.w / 2, right = basket.x + basket.w / 2;
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy * dt;
      it.sway += dt * 2;
      it.x += Math.sin(it.sway) * 20 * dt;
      it.rot += it.vr * dt;

      const bottom = it.y + it.h / 2;
      // 바구니 입구에 닿으면 캐치
      if (bottom >= basket.y && bottom <= basket.y + basket.h * 0.6 && it.x > left && it.x < right) {
        items.splice(i, 1);
        if (it.type === 'spam') {
          burst(it.x, basket.y, '#ff5a5a');
          loseLife(it.x, basket.y - 10, '스팸! -1');
        } else {
          const pts = it.type === 'gold' ? 50 : 10;
          score += pts;
          vibrate(15);
          burst(it.x, basket.y, it.type === 'gold' ? '#ffcc33' : '#ffffff', it.type === 'gold' ? 20 : 10);
          popup(it.x, basket.y - 10, '+' + pts, it.type === 'gold' ? '#ffcc33' : '#ffffff');
          updateHud();
        }
        if (!running) return;
        continue;
      }
      // 바닥으로 떨어짐
      if (it.y - it.h / 2 > H) {
        items.splice(i, 1);
        if (it.type !== 'spam') {
          loseLife(Math.max(40, Math.min(W - 40, it.x)), H - 40, '놓침!');
          if (!running) return;
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y -= 50 * dt; p.life -= dt;
      if (p.life <= 0) popups.splice(i, 1);
    }
    if (shake > 0) shake -= dt;
  }

  // ---------- 그리기 ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1e2a44');
    g.addColorStop(1, '#3b5b8c');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // 구름
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    const t = performance.now() / 1000;
    for (let i = 0; i < 5; i++) {
      const cx = ((i * 230 + t * (10 + i * 4)) % (W + 200)) - 100;
      const cy = 80 + i * (H / 6);
      ctx.beginPath();
      ctx.arc(cx, cy, 40, 0, Math.PI * 2);
      ctx.arc(cx + 40, cy + 6, 32, 0, Math.PI * 2);
      ctx.arc(cx - 38, cy + 8, 28, 0, Math.PI * 2);
      ctx.fill();
    }
    // 바닥
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(0, basket.y + basket.h, W, H);
  }

  function drawItem(it) {
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.rot);
    const w = it.w, h = it.h;
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 6; ctx.shadowOffsetY = 3;

    if (it.type === 'spam') {
      // 봉투 + 금지 표시
      ctx.fillStyle = '#ffe0e0';
      roundRect(-w / 2, -w * 0.35, w, w * 0.7, 4); ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = '#d23c3c'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-w / 2, -w * 0.35); ctx.lineTo(0, w * 0.05); ctx.lineTo(w / 2, -w * 0.35); ctx.stroke();
      ctx.lineWidth = 3.5; ctx.strokeStyle = '#ff3b3b';
      ctx.beginPath(); ctx.arc(0, 0, w * 0.42, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-w * 0.3, -w * 0.3); ctx.lineTo(w * 0.3, w * 0.3); ctx.stroke();
    } else {
      const gold = it.type === 'gold';
      ctx.fillStyle = gold ? '#fff4c2' : '#ffffff';
      roundRect(-w / 2, -h / 2, w, h, 4); ctx.fill();
      ctx.shadowColor = 'transparent';
      if (gold) { ctx.strokeStyle = '#ffcc33'; ctx.lineWidth = 3; roundRect(-w / 2, -h / 2, w, h, 4); ctx.stroke(); }
      // 사진
      ctx.fillStyle = gold ? '#e0a800' : '#8fb3e8';
      ctx.fillRect(-w / 2 + w * 0.12, -h / 2 + h * 0.1, w * 0.3, h * 0.28);
      // 제목줄
      ctx.fillStyle = '#334';
      ctx.fillRect(-w / 2 + w * 0.5, -h / 2 + h * 0.13, w * 0.38, h * 0.06);
      ctx.fillStyle = '#99a';
      ctx.fillRect(-w / 2 + w * 0.5, -h / 2 + h * 0.25, w * 0.28, h * 0.05);
      // 본문줄
      for (let k = 0; k < 4; k++) {
        ctx.fillRect(-w / 2 + w * 0.12, -h / 2 + h * (0.48 + k * 0.11), w * (k % 2 ? 0.6 : 0.76), h * 0.045);
      }
      if (gold) {
        ctx.fillStyle = '#ffcc33';
        ctx.font = `${Math.round(w * 0.45)}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('★', w * 0.32, h * 0.35);
      }
    }
    ctx.restore();
  }

  function drawBasket() {
    const { x, y, w, h } = basket;
    const top = w, bot = w * 0.78;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
    ctx.fillStyle = '#b8793a';
    ctx.beginPath();
    ctx.moveTo(x - top / 2, y);
    ctx.lineTo(x + top / 2, y);
    ctx.lineTo(x + bot / 2, y + h);
    ctx.lineTo(x - bot / 2, y + h);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    // 엮은 무늬
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = 'rgba(90,50,20,0.45)'; ctx.lineWidth = 2;
    for (let i = 1; i < 4; i++) {
      const yy = y + (h * i) / 4;
      ctx.beginPath(); ctx.moveTo(x - top / 2, yy); ctx.lineTo(x + top / 2, yy); ctx.stroke();
    }
    for (let i = -4; i <= 4; i++) {
      ctx.beginPath(); ctx.moveTo(x + (i * top) / 9, y); ctx.lineTo(x + (i * bot) / 9, y + h); ctx.stroke();
    }
    ctx.restore();
    // 테두리
    ctx.fillStyle = '#8a5526';
    roundRect(x - top / 2 - 4, y - 6, top + 8, 10, 5); ctx.fill();
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
    drawBackground();
    items.forEach(drawItem);
    drawBasket();
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 22px sans-serif';
    popups.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / 0.9);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    });
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function loop(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000);
    lastT = t;
    if (running) update(dt);
    else {
      // 대기 중에도 파티클·팝업은 마저 움직임
      particles.forEach(p => { p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
      particles = particles.filter(p => p.life > 0);
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- 입력: 터치·마우스(Pointer Events) + 키보드 ----------
  function setTarget(e) { basket.targetX = e.clientX; }
  canvas.addEventListener('pointerdown', e => { setTarget(e); try { canvas.setPointerCapture(e.pointerId); } catch (_) {} });
  canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) setTarget(e); });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if ((e.key === ' ' || e.key === 'Enter') && !running) start();
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });
  $('startBtn').addEventListener('click', start);
  $('retryBtn').addEventListener('click', start);

  // 탭 전환 시 시간 점프 방지
  document.addEventListener('visibilitychange', () => { lastT = performance.now(); });

  window.addEventListener('resize', resize);
  resize();
  $('bestStart').textContent = best;
  updateHud();
  lastT = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
